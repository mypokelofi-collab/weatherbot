# flowbot - live paper trading on real Binance USDⓈ-M market data.
#
# Nothing in this file can place a real order: the bot has no exchange
# credentials and no live broker implementation. Market data, the order book,
# fill mechanics and costs are real; the money is not.

mode: paper
log_level: INFO
state_dir: data/state
autostart: true

data:
  venue: binance-futures      # binance-futures | binance-spot | coinbase | simulator | replay
  symbol: BTCUSDT
  interval: 15m
  depth_limit: 1000
  depth_speed: 100ms
  backfill_bars: 400
  record: false               # set true to capture the feed for later backtests
  record_path: data/recordings/{venue}-{symbol}-{date}.jsonl
  stale_feed_seconds: 90

signal:
  ema_fast: 21
  ema_slow: 55
  atr_period: 14
  rsi_period: 14
  adx_period: 14
  donchian_period: 20
  roc_period: 8
  flow_bars: 6
  warmup_bars: 80
  weights:
    trend: 0.22
    trend_slope: 0.12
    macd: 0.12
    breakout: 0.15
    rsi: 0.08
    momentum_z: 0.10
    flow: 0.13
    book: 0.08
  entry_threshold: 0.35
  exit_threshold: 0.10
  flip_threshold: 0.30
  min_adx: 18
  require_trend_alignment: true
  min_atr_pct: 0.06
  max_atr_pct: 3.0
  max_spread_bps: 4.0
  min_depth_usd: 150000

risk:
  # Paper bankroll. Everything below is sized around it.
  start_equity: 50

  # NOTE ON SMALL BANKROLLS
  # Binance USDⓈ-M BTCUSDT has a 0.001 BTC lot step and a $100 minimum
  # notional, so the smallest order the venue accepts is ~0.002 BTC (~$140 at
  # $70k). On a $50 account that is ~2.8x leverage and risks 1.1-2.7% of
  # equity depending on volatility - well above the 0.5% a larger account
  # would use. The bot handles this explicitly rather than silently:
  #   * min_lot_fallback  - take the venue minimum when risk-based sizing
  #                         rounds below it
  #   * max_risk_per_trade_pct - and refuse the trade when that minimum would
  #                         risk more than this (happens above ~0.8% ATR)
  # At boot the log states exactly what this bankroll can do. To get textbook
  # 0.5% risk sizing instead, either raise start_equity to ~$1,000+, or switch
  # data.venue to binance-spot (min notional $5) and accept long-only.
  risk_per_trade_pct: 0.5
  min_lot_fallback: true
  max_risk_per_trade_pct: 4.0
  max_position_pct: 300          # must exceed 100% or the $100 venue minimum
  leverage_cap: 3                # is unreachable on a $50 account
  allow_short: true
  stop_atr_mult: 1.6
  trail_atr_mult: 2.2
  breakeven_at_r: 1.0
  take_profit_r: 1.8
  partial_exit_pct: 50
  runner_exit_r: 4.0
  max_bars_in_trade: 24
  # A single minimum-lot loss can be ~2.7% of a $50 account, so a 3% daily
  # cap would end the day after one trade. Scaled to the account.
  daily_loss_limit_pct: 10.0
  max_consecutive_losses: 4
  cooldown_bars: 1
  loss_cooldown_bars: 2
  max_trades_per_day: 12
  reverse_on_flip: true

execution:
  entry_order: limit          # market | limit | post_only
  exit_order: market
  limit_offset_ticks: 1
  limit_timeout_s: 45
  taker_fee_bps: 4.5          # Binance USDⓈ-M taker, no VIP tier, no BNB discount
  maker_fee_bps: 1.8
  latency_ms: 120
  max_slippage_bps: 12
  allow_partial_fills: true
  queue_model: fifo

server:
  host: 0.0.0.0
  port: 8033
  title: "flowbot · BTC 15m momentum"
  broadcast_hz: 4
  auth_token: ""              # set to require ?token=… on the dashboard

polymarket:
  enabled: false
