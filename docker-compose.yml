# flowbot on a VPS.
#
#   cp .env.example .env     # set a dashboard token before exposing the port
#   docker compose up -d --build
#   docker compose logs -f
#
# The dashboard is published on ${HOST_PORT:-8033}. Bound to 0.0.0.0 by
# default so it is reachable from your browser - which is exactly why
# FLOWBOT_SERVER__AUTH_TOKEN should be set. To keep it private instead, set
# BIND_ADDR=127.0.0.1 and reach it over an SSH tunnel:
#     ssh -N -L 8033:127.0.0.1:8033 user@your-vps

# Pinned so the project never collides with anything else on the host.
# Without this, compose derives the project from the directory name, and
# every scoped command (down, ps, remove-orphans) would aim at the wrong set
# of containers on a machine already running other bots.
name: flowbot-btc15m

services:
  flowbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowbot:latest
    # Override with COMPOSE_CONTAINER_NAME if the host already has a
    # container by this name.
    container_name: ${CONTAINER_NAME:-flowbot-btc15m}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FLOWBOT_SERVER__HOST: "0.0.0.0"
      FLOWBOT_SERVER__PORT: "8033"
      FLOWBOT_STATE_DIR: "/app/data/state"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-8033}:8033"
    volumes:
      # Trade ledger, equity history and recordings survive redeploys.
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8033/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
